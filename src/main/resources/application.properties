spring.application.name=pqr-service
server.port=8083

# MySQL Datasource - Isolated Database for PQR Service
spring.datasource.url=jdbc:mysql://localhost:3306/lexia_pqr_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=CrIstian3434.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate & JPA - Strict schema validation
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
